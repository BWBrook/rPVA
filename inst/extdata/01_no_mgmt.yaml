# Lord Howe Island woodhen – Scenario 1 (no management intervention)
# The year is 1980. The woodhen is on the brink, having been pushed to a few pockets of cloud forest 
# habitat on Lord Howe Island's highest peaks. Pigs exclude it from the lowlands. What are the chances,  
# in this situation, that the woodhen would have still persist by the year 2020?

# Only about 4-6 viable breeding pairs remained. The habitat was restricted to a carrying capacity (K)  
# of ~10 (i.e., this small area of pig-free habitat could support ~10 breeding territories, plus juveniles).

name: woodhen_no_intervention
