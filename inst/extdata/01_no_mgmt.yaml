# Lord Howe Island woodhen – Scenario 1 (no management intervention)
# The year is 1979. The woodhen is on the brink, having been pushed to a few pockets of cloud forest 
# habitat on Lord Howe Island's highest peaks. Pigs exclude it from the lowlands. What are the chances,  
# in this situation, that the woodhen would have still persist today, in the year 2025?

# Only about 3-5 viable breeding pairs remained. The habitat was restricted to a carrying capacity (K) = 20  
# (i.e., this small area of pig-free habitat could support at most about 20 breeding territories, plus juveniles).

name: woodhen_no_intervention
