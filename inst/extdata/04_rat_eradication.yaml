# Lord Howe Island woodhen – Scenario 4 (rat eradication)
# In 2020, a rat eradication programme was implemented, to supress egg predation,  
# remove the predation of chicks, and improve invertebrate food supply.  
# This scenario starts with the 2020 population size and projects to 2025.  

name:           woodhen_rat_eradication
years:          25                                         # Forecast to 2050
n0:             [123, 60, 34, 25, 16, 10, 6]               # Female age distribution in 2025 0=123 or 351?
K:              200                                        # habitat lifts after rats removed
K_sd:           50
surv:           [0.50, 0.65, 0.85, 0.75, 0.75, 0.65, 0.5]  # ↑ juv survival from 0.35 to 0.5
fecund:         [0, 1.0, 2.2, 2.42, 2.2, 1.65, 0.55]       # 10% ↑ to recruitment
F_init:         0.35                                       # Inbreeding coefficient after recovery
