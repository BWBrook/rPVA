# Lord Howe Island woodhen – Tests Scenario

# Simulation settings
name:           woodhen_test                                # scenario name
years:          20                                          # number of years to simulate
reps:           10                                        # number of stochastic replications

# Vital rates: this woodhen model has 7 stages (ages):
surv:           [0.35, 0.75, 0.75, 0.75, 0.75, 0.5, 0.5]    # stage-specific survival
fecund:         [0, 0.5, 1.5, 1.75, 1.5, 1.0, 0.5]          # mean fledglings per ♀ (fertility/fecundity)
sex_ratio_init: 0.50                                        # F/(F+M) in starting population
monogamy:       TRUE                                        # if FALSE, ignore SR constraint

# Population Dynamics
n0:             [6, 4, 2, 1, 1, 0, 0]                       # starting stage vector (integers)
demo_sd:        TRUE                                        # demo stoch (binomial/pois: FALSE = off, TRUE = on)
K:              50                                          # limited habitat on the mountain tops

# Environmental Variation
env_sd:         0.25                                        # σ_env (log-normal: range 0-0.4)

cat_freq:       0.05                                        # annual probability of a catstrophe (cyclone)
cat_surv:       0.50                                        # survival multiplier in a catastrophe year
cat_repro:      0.75                                        # fecundity multiplier in a catastrophe year

# Genetics
genetics:       TRUE                                        # apply inbreeding depression?
F_init:         0.00                                        # initial inbreeding coefficent (F: 0-1) 
lethal_equiv:   [3, 1, 0.5, 0.2, 0.1, 0.1, 0.1]             # life-cycle: one value per stage, J → last
B_on_fec:       0.1                                         # scalar applied to fecundity (0 = off)
Ne_N_ratio:     0.30                                        # effective to census population size ratio (0.01-1)
Ne_window:      10                                          # years contributing to harmonic mean
purge_kappa:    0.1                                         # purging constant for recessive lethal allelles (0-1)

# Management Interventions
removal_years:  [2, 4, 6]                                   # years (1…T) when removals occur
removal_vec:    [0, 0, 0, 0, 0, 0, 0]                       # number removed from each stage (same length as n0)

release_years:  [1, 2, 3, 4]                                # simulation years when new individuals are released
release_vec:    [0, 0, 0, 0, 0, 0, 0]                       # stage vector to add new individuals
