# _woodhen_base.yaml
name:           woodhen_base                                # will be overwritten
years:          46                                          # number of years to simulate (1979-2025)
reps:           1000                                        # number of stochastic replications

# Vital rates: this woodhen model has 7 stages (ages):
surv:           [0.35, 0.65, 0.85, 0.75, 0.75, 0.65, 0.5]   # age-specific survival
fecund:         [0, 1.0, 2.0, 2.2, 2.0, 1.5, 0.5]           # mean fledglings per ♀ (fertility/fecundity)
sex_ratio_init: 0.5                                         # F/(F+M) in starting population
monogamy:       TRUE                                        # if FALSE, ignore SR constraint

# Population Dynamics
n0:             [9, 2, 1, 1, 1, 0, 0]                       # starting age vector of females (integers)
demo_sd:        TRUE                                        # demo stoch (binomial/pois: FALSE = off, TRUE = on)
env_sd:         0.25                                        # σ_env (log-normal/beta: range 0-0.4)
K:              20                                          # limited habitat on the mountain tops (max. number of pairs)
K_sd:           5                                           # σ_env on K (habitat variability)

# Catastrophes
cat_freq:       0.04                                        # annual probability of a catstrophe (cyclone)
cat_surv:       0.50                                        # survival multiplier in a catastrophe year
cat_repro:      0.75                                        # fecundity multiplier in a catastrophe year

# Genetics
genetics:       TRUE                                        # apply inbreeding depression? (TRUE or FALSE)
F_init:         0.00                                        # initial inbreeding coefficent (F: 0-1) 
lethal_equiv:   [3, 1, 0.5, 0.2, 0.1, 0.1, 0.1]             # LE (B) on survival: one value per stage, J → last
B_on_fec:       0.1                                         # multiplier on LE to fecundity (0 = off)
Ne_N_ratio:     0.4                                         # effective to census population size ratio (0.01-1)
Ne_window:      10                                          # years contributing to harmonic mean for Ne
purge_kappa:    15                                          # purging constant for recessive lethal allelles

# Management Interventions
removal_years:  [1]                                         # years (1…T) when removals occur
removal_vec:    [0, 0, 0, 0, 0, 0, 0]                       # number removed from each stage (same length as n0)

release_years:  [2, 3, 4]                                   # simulation years when new individuals are released
release_vec:    [0, 0, 0, 0, 0, 0, 0]                      # stage vector to add new individuals
