# Lord Howe Island woodhen – Scenario 4 (rodent eradication programme)
# In 2019, a rodent eradication programme was implemented, to supress egg predation,  
# remove the predation of chicks, and improve the invertebrate food supply for woodhens.  
# This scenario starts with the 2019 population release size of 208 birds and projects  
# to 2024 (latest survey). It models stronger post-eradication recruitment and
# improved juvenile and sub-adult survival.

name:           woodhen_rat_eradication
years:          5                                        # Forecast from 2019 to 2024
n0:             [62, 17, 9, 6, 5, 3, 2]                  # 208 birds (104 ♀) re-relased in 2019 after baiting ceased
K:              325                                      # approximate ceiling for territory-holding pairs
K_sd:           35
surv:           [0.6, 0.75, 0.85, 0.75, 0.75, 0.65, 0.5] # survival rates of age 0 and 1 ↑
fecund:         [0, 1.8, 3.6, 3.96, 3.6, 3.0, 1.8]       # stronger recruitment after rodent removal
F_init:         0.4                                      # Inbreeding coefficient after earlier recovery
lethal_equiv:   [0.2, 0, 0, 0, 0, 0, 0]                  # LE (B) on survival: most already purged
purge_kappa:    0                                        # no further purging
