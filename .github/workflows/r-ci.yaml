name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Bootstrap
        run: Rscript -e 'source("bootstrap.R")'

      - name: renv status
        run: Rscript -e 'renv::status(sources = FALSE)'

      - name: Test suite
        run: Rscript -e 'source("bootstrap.R"); testthat::test_dir("tests/testthat", reporter = "summary")'

      - name: Woodhen smoke test
        run: Rscript -e 'source("bootstrap.R"); print(run_scenarios("woodhen", csv_out = NULL, rds_out = NULL, keep_traj = FALSE, parallel = FALSE))'
