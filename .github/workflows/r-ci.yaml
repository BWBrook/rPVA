name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Prime renv restore dependency
        run: |
          Rscript --vanilla - <<'RS'
          source("renv/activate.R")
          install.packages(
            "https://cran.r-project.org/src/contrib/Archive/listenv/listenv_0.10.1.tar.gz",
            repos = NULL,
            type = "source",
            lib = .libPaths()[1]
          )
          RS

      - name: Bootstrap
        run: Rscript -e 'source("bootstrap.R")'

      - name: renv status
        run: Rscript -e 'renv::status(sources = FALSE)'

      - name: Test suite
        run: Rscript -e 'source("bootstrap.R"); testthat::test_dir("tests/testthat", reporter = "summary")'

      - name: Woodhen smoke test
        run: Rscript -e 'source("bootstrap.R"); print(run_scenarios("woodhen", csv_out = NULL, rds_out = NULL, keep_traj = FALSE, parallel = FALSE))'
