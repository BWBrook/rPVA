# Non-live nginx example for review only.
# The real gateway file on deep-server must not be edited from this scaffold.

upstream rpva_practical1_shinyproxy {
    # Choose one internal port in the implementation goal.
    # Goal 017 notes the current gateway may already proxy to 127.0.0.1:3838.
    server 127.0.0.1:3838;
}

location /rpva-practical1/ {
    proxy_pass http://rpva_practical1_shinyproxy/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /rpva-practical1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /rpva-practical1-health {
    proxy_pass http://rpva_practical1_shinyproxy/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
